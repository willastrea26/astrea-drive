<!DOCTYPE html>
<html lang="en-AU">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Astrea Drive</title>
  <link rel="icon" type="image/png" href="assets/favicon.png?v=81">
  <link rel="apple-touch-icon" href="assets/favicon.png?v=81">
  <!-- Leaflet (map library). Needs internet; the app still runs without it, maps show a notice. -->
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.css">
  <!-- MapLibre GL draws the styled vector basemap (OpenFreeMap tiles, no API key) -->
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/maplibre-gl/4.7.1/maplibre-gl.css">
  <!-- Marker clustering for trucks that share or crowd a location -->
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/leaflet.markercluster/1.5.3/MarkerCluster.min.css">
  <link rel="stylesheet" href="css/styles.css?v=83">
</head>
<body>
  <!-- Sign-in gate. Shown until Supabase confirms a session; #app-shell stays
       hidden until then so nobody sees the shell flash before we know who's signed in. -->
  <div class="auth-gate" id="auth-gate" hidden>
    <form class="auth-card" id="auth-form" novalidate>
      <img src="assets/logo-lockup.png?v=81" alt="Astrea Drive" width="160" height="43" class="auth-logo">
      <h1>Sign in</h1>
      <p class="auth-sub">Fleet operations — approved staff only</p>
      <label class="field auth-field">
        <span>Email</span>
        <input type="email" name="email" autocomplete="username" required>
      </label>
      <label class="field auth-field">
        <span>Password</span>
        <input type="password" name="password" autocomplete="current-password" required>
      </label>
      <p class="auth-error" id="auth-error" hidden></p>
      <button type="submit" class="btn btn-primary auth-submit">Sign in</button>
    </form>
  </div>

  <!-- Preview switch: shows the app at iPhone width in a frame, or full-size on the computer -->
  <div class="device-toggle" id="device-toggle" role="group" aria-label="Preview size">
    <button type="button" data-device="computer" aria-pressed="true"></button>
    <button type="button" data-device="iphone" aria-pressed="false"></button>
  </div>
  <div class="device-stage" id="device-stage" hidden>
    <div class="phone">
      <div class="phone-screen">
        <div class="phone-status"><span id="phone-time">9:41</span><i class="phone-island"></i><span class="phone-icons"></span></div>
        <iframe id="device-frame" title="Astrea Drive at iPhone size"></iframe>
        <i class="phone-home"></i>
      </div>
    </div>
    <p class="device-caption">iPhone preview · 390 px wide · same data as the computer view</p>
  </div>

  <div class="app" id="app-shell" hidden>
    <aside class="sidebar" id="sidebar">
      <a class="brand" href="#/dashboard" aria-label="Astrea Drive home">
        <img src="assets/logo-lockup.png?v=81" alt="Astrea Drive" width="184" height="50">
      </a>
      <nav class="nav" id="nav" aria-label="Main"></nav>
      <div class="sidebar-hero">
        <img src="assets/sidebar-hero.jpg?v=81" alt="" loading="lazy">
      </div>
      <div class="sidebar-foot">
        <span class="clock" id="tz-clock" title="All scheduling uses Australia/Sydney time"></span>
        <span class="user-tag" id="user-tag" title="Signed in"></span>
        <button class="link-btn" id="signout-btn" type="button">Sign out</button>
      </div>
    </aside>
    <div class="scrim" id="scrim"></div>

    <div class="main">
      <header class="topbar">
        <button class="icon-btn" id="menu-btn" aria-label="Open navigation"></button>
        <img class="topbar-logo" src="assets/logo-lockup.png?v=81" alt="Astrea Drive">
        
      </header>
      <!-- Full-bleed banner slot. Views that want one fill it; the router clears it. -->
      <div class="hero-slot" id="hero-slot"></div>
      <main class="view" id="view" tabindex="-1"></main>
    </div>
  </div>

  <div id="modal-root"></div>
  <div id="toast-root" aria-live="polite"></div>

  <script src="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/maplibre-gl/4.7.1/maplibre-gl.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/@maplibre/maplibre-gl-leaflet@0.1.3/leaflet-maplibre-gl.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/leaflet.markercluster/1.5.3/leaflet.markercluster.min.js"></script>
  <!-- Supabase client (auth + database). UMD build exposes window.supabase.createClient(). -->
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.js"></script>
  <script src="js/core/time.js?v=81"></script>
  <script src="js/core/icons.js?v=81"></script>
  <script src="js/core/vehicle-art.js?v=83"></script>
  <script src="js/core/ui.js?v=81"></script>
  <script src="js/core/viz.js?v=81"></script>
  <script src="js/core/weather.js?v=81"></script>
  <script src="js/core/config.js?v=81"></script>
  <script src="js/core/auth.js?v=81"></script>
  <script src="js/data/store.js?v=81"></script>
  <script src="js/core/logic.js?v=81"></script>
  <script src="js/core/maps.js?v=81"></script>
  <script src="js/views/dashboard.js?v=82"></script>
  <script src="js/views/fleet.js?v=82"></script>
  <script src="js/views/vehicle.js?v=81"></script>
  <script src="js/views/maintenance.js?v=81"></script>
  <script src="js/views/power-tools.js?v=81"></script>
  <script src="js/views/first-aid.js?v=81"></script>
  <script src="js/views/fire-extinguishers.js?v=81"></script>
  <script src="js/views/workshops.js?v=81"></script>
  <script src="js/views/defects.js?v=82"></script>
  <script src="js/views/documents.js?v=81"></script>
  <script src="js/views/hired-import.js?v=81"></script>
  <script src="js/views/booking-form.js?v=81"></script>
  <script src="js/views/calendar.js?v=81"></script>
  <script src="js/views/tracker.js?v=81"></script>
  <script src="js/app.js?v=81"></script>
</body>
</html>
